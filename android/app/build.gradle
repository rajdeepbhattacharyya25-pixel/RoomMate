import org.gradle.api.GradleException

apply plugin: 'com.android.application'

android {
    namespace = "io.campusflow.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.campusflow.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 10
        versionName "1.0.4"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:!*.apk'
        }
    }
    signingConfigs {
        debug {
            // Standard Android debug keystore
        }
        staging {
            initWith(signingConfigs.debug)
        }
        release {
            def prodStorePath = System.getenv('ROOMMATE_PROD_KEYSTORE_PATH') ?: (project.hasProperty('ROOMMATE_PROD_KEYSTORE_PATH') ? project.property('ROOMMATE_PROD_KEYSTORE_PATH') : null)
            if (prodStorePath && file(prodStorePath).exists()) {
                storeFile file(prodStorePath)
                storePassword System.getenv('ROOMMATE_PROD_KEYSTORE_PASSWORD') ?: project.property('ROOMMATE_PROD_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ROOMMATE_PROD_KEY_ALIAS') ?: project.property('ROOMMATE_PROD_KEY_ALIAS')
                keyPassword System.getenv('ROOMMATE_PROD_KEY_PASSWORD') ?: project.property('ROOMMATE_PROD_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        staging {
            initWith(buildTypes.release)
            matchingFallbacks = ['release', 'debug']
            signingConfig signingConfigs.staging
            debuggable false
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    if (taskGraph.hasTask(':app:packageRelease') || taskGraph.hasTask(':app:assembleRelease')) {
        if (!android.signingConfigs.release.storeFile || !android.signingConfigs.release.storeFile.exists()) {
            throw new GradleException("PRODUCTION RELEASE SIGNING ERROR: An explicit production keystore is mandatory for ':app:assembleRelease' (provide ROOMMATE_PROD_KEYSTORE_PATH, ROOMMATE_PROD_KEYSTORE_PASSWORD, ROOMMATE_PROD_KEY_ALIAS, ROOMMATE_PROD_KEY_PASSWORD). Production builds must never silently fall back to debug signing. For staging builds intentionally signed with the debug/staging key, use ':app:assembleStaging'.")
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
        apply plugin: 'com.google.firebase.crashlytics'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services & crashlytics plugins not applied.")
}
