<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- RoomMate Favicon — actual logo PNG -->
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- PWA Icons -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0a0e17" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="RoomMate — Live Together. Spend Smarter. The student-first shared expense tracker &amp; room ledger app." />
    <title>RoomMate</title>
    <!-- Anti-Flash Theme Pre-Hydration -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('roommate_theme') || 'system';
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = saved === 'dark' || (saved === 'system' && prefersDark);
          if (isDark) {
            document.documentElement.classList.add('dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#0B0B10');
          } else {
            document.documentElement.classList.remove('dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#F9F9FF');
          }
        } catch (e) {}
      })();
    </script>
    <!-- Local Bundled Tailwind CSS (Offline-First & WebView Compliant) -->
    <script src="./tailwind.js"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                DEFAULT: '#0C6B70',
                dark: '#07545A',
                darker: '#043438',
                surface: '#F6F9F8',
                card: '#FFFFFF',
                border: '#E4EBE9',
                mint: '#E0F2F0',
                soft: '#EBF5F4',
                charcoal: '#10201E',
                slate: '#647370',
              }
            },
            boxShadow: {
              'fin-sm': '0 1px 2px rgba(16, 32, 30, 0.04)',
              'fin-card': '0 4px 20px -2px rgba(12, 107, 112, 0.05), 0 2px 6px -1px rgba(0, 0, 0, 0.02)',
              'fin-card-hover': '0 12px 30px -4px rgba(12, 107, 112, 0.08), 0 4px 10px -2px rgba(0, 0, 0, 0.03)',
              'fin-float': '0 24px 48px -12px rgba(7, 84, 90, 0.16), 0 8px 24px -4px rgba(0, 0, 0, 0.04)',
              'fin-glow': '0 0 50px -10px rgba(12, 107, 112, 0.15)'
            },
            letterSpacing: {
              tighter: '-0.035em',
              tight: '-0.02em',
            },
            fontFamily: {
              sans: ['Inter', 'Plus Jakarta Sans', 'system-ui', 'sans-serif'],
              mono: ['JetBrains Mono', 'SF Mono', 'monospace'],
            },
            spacing: {
              '0.2': '1px',
              '4.5': '1.125rem',
              '13': '3.25rem',
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-[#F9F9FF] dark:bg-[#0B0B10] text-[#111827] dark:text-[#F8FAFC] min-h-screen antialiased transition-colors duration-150">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
