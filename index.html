<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- RoomMate Favicon — actual logo PNG -->
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- PWA Icons -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0a0e17" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="RoomMate — Live Together. Spend Smarter. The student-first shared expense tracker &amp; room ledger app." />
    <title>RoomMate</title>
    <!-- Tailwind CSS CDN with Subresource Integrity (SRI) verification -->
    <script src="https://cdn.tailwindcss.com/3.4.17" integrity="sha384-igm5BeiBt36UU4gqwWS7imYmelpTsZlQ45FZf+XBn9MuJbn4nQr7yx1yFydocC/K" crossorigin="anonymous"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                DEFAULT: '#0C6B70',
                dark: '#07545A',
                darker: '#043438',
                surface: '#F6F9F8',
                card: '#FFFFFF',
                border: '#E4EBE9',
                mint: '#E0F2F0',
                soft: '#EBF5F4',
                charcoal: '#10201E',
                slate: '#647370',
              }
            },
            boxShadow: {
              'fin-sm': '0 1px 2px rgba(16, 32, 30, 0.04)',
              'fin-card': '0 4px 20px -2px rgba(12, 107, 112, 0.05), 0 2px 6px -1px rgba(0, 0, 0, 0.02)',
              'fin-card-hover': '0 12px 30px -4px rgba(12, 107, 112, 0.08), 0 4px 10px -2px rgba(0, 0, 0, 0.03)',
              'fin-float': '0 24px 48px -12px rgba(7, 84, 90, 0.16), 0 8px 24px -4px rgba(0, 0, 0, 0.04)',
              'fin-glow': '0 0 50px -10px rgba(12, 107, 112, 0.15)'
            },
            letterSpacing: {
              tighter: '-0.035em',
              tight: '-0.02em',
            },
            fontFamily: {
              sans: ['Inter', 'Plus Jakarta Sans', 'system-ui', 'sans-serif'],
              mono: ['JetBrains Mono', 'SF Mono', 'monospace'],
            },
            spacing: {
              '0.2': '1px',
              '4.5': '1.125rem',
              '13': '3.25rem',
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-[#0a0e17] text-gray-100 min-h-screen antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
